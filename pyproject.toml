[project]
name = "trader"
version = "0.1.0"
description = "Personal swing-trading platform on Alpaca"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.30.0",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    # Backtest report
    "plotly>=5.18.0",
    # Dashboard
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
trader = "trader.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trader*"]

[tool.setuptools.package-data]
"trader.dashboard" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
